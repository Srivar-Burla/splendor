name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rules tests
        run: python test_game.py
      - name: Randomized playthroughs
        run: python test_playthrough.py
      - name: Server tests
        run: python test_server.py
      - name: SSE test
        run: python test_sse.py
